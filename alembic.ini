[alembic]
script_location = app/store/migrations

# Alembic is run from the repo root, and env.py imports app.config.
prepend_sys_path = .

# Revision files sort by name in the versions/ listing, so lead with a counter
# rather than Alembic's default bare hash -- the order migrations were written
# in is the one thing you want to see when opening that directory.
file_template = %%(rev)s_%%(slug)s

# Deliberately no `sqlalchemy.url` here. This file is committed; a DSN carries a
# password (C-5). env.py reads it from app.config instead, so there is exactly
# one place the database is named and it is not in the repo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
