# Brief angles for PinoySing.
#
# `shared` is appended to whichever angle is picked, so the rules that apply to
# every post are written once. `{today}` is filled at build time in the brand's
# timezone -- never at import, or a long-lived process posts yesterday's date.

shared: |
  Siguruhing sundin ang voice at example patterns ng brand na ito.
  Magdagdag din ng naaayon na emojis sa iyong post katulad ng mga examples.
  Ilimit up to 130 characters ang iyong post.

angles:
  trivia_music: |
    Mag search online ng mga trivia at fun facts about karaoke or music at gumawa ng isang post.

  trending_music: |
    Mag search online ng mga trending topics about karaoke or music ngayong araw, {today}, at gumawa ng isang post.

  fun_nonmusic: |
    Mag search online ng mga nakakaaliw na trending topics ngayong araw, {today}, at gumawa ng isang post.
    Okay lang kahit di related sa music or karaoke basta nakakaaliw.

  app_feature: |
    Pumili ng isang bagay na kayang gawin ng PinoySing at gumawa ng post tungkol
    dito: paghahanap gamit ang title o pangalan ng artist, pag-reserve ng
    sunod-sunod na kanta, o ang score na lumalabas
    pagkatapos ng kanta. Libre at walang login para makakanta.
    Isa lang ang i-post; huwag listahan ng features.
    Huwag sabihing sinusukat ng app ang boses, tono, o galing mag-kanta.

  song_spotlight: |
    Mag search online ng isang sikat na OPM o karaoke classic at gumawa ng post
    tungkol dito -- kung bakit paborito sa videoke, o anong parte ang lagi nang
    hirap kantahin. Yayain silang hanapin ito sa PinoySing, pero huwag mangako
    na nandoon na ito sa library.

  artist_spotlight: |
    Mag search online tungkol sa isang Pinoy artist o banda at gumawa ng post
    tungkol sa mga kanta nilang laging kinakanta sa videoke. Pwedeng luma o
    bago, basta kilala ng karamihan.

  okasyon: |
    Gumawa ng post na naka-angkla sa okasyon o panahon ngayong {today} --
    birthday, fiesta, reunion, payday Friday, Pasko, bakasyon, uwian ng OFW.
    Ikabit sa videoke: anong kanta ang bagay, sino ang unang aagaw ng mic.

  karaoke_culture: |
    Gumawa ng post tungkol sa mga relatable na eksena sa videoke -- yung ayaw
    bitawan ang mic, yung nagre-reserve agad ng limang kanta, yung laging may
    kaduet. Biruan na mapagmahal; hindi kailanman panlalait ng boses ninuman.

  duet_night: |
    Gumawa ng post tungkol sa mga kantang masarap i-duet o sabayan ng barkada.
    Yayain silang mag-reserve ng dalawa o tatlo para tuloy-tuloy ang gabi.
