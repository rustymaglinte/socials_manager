slug: pinoysing
display_name: "PinoySing"
tier: brand
policy_profile: standard
slack_channel: "#pinoysing-socials"
# The audience's clock, not the server's -- decides what "ngayong araw" means
# in a brief (see briefs.yaml).
timezone: "Asia/Manila"

# Ids are not written here: each comes from the environment, so the live and
# test Page are a variable apart rather than a commit apart.
#   FB_PAGE_ID_PINOYSING   the live Page's id, or the test Page's
#   X_HANDLE_PINOYSING, YOUTUBE_CHANNEL_ID_PINOYSING
# Unset means unpublishable, and a page_id/handle/channel_id key here refuses
# to load. See .env.example.
accounts:
  - platform: facebook # Page, via Graph API
    enabled: true
  - platform: x
    enabled: true
  - platform: youtube
    enabled: true

cadence:
  # Twice a day. 1-2 posts/day is the norm for a Facebook Page; more splits the
  # same small organic reach across more posts.
  max_per_day: 2
  max_per_week: 14
  # When the scheduler drafts, in this brand's timezone. Two slots seven hours
  # apart from 12:00 -- 12:00 and 19:00, lunch and the evening karaoke crowd --
  # which is exactly max_per_day, so the day closes on its own.
  # Quote it: unquoted 12:00 is sexagesimal in YAML and parses as a number.
  every_hours: 7
  first_slot: "12:00"
  # A post publishes when it is approved, so a draft left waiting until the gap
  # to the next slot would let 19:00's go out after midnight. Three hours caps
  # it: an unapproved draft expires by 15:00 or 22:00.
  approval_hours: 3

approval:
  required: always
  max_schedule_days_ahead: 30

banned_terms: []
hashtags:
  default: ["#PinoySing", "#karaoke", "#videoke", "#onlinekaraoke"]

# Post graphics. Sampled from the Page's own profile picture, so the feed and
# the avatar agree. Two colours and no third: they swap roles between templates,
# and a third would leave a decision to make on every post.
theme:
  ground: "#3A3A38" # charcoal
  accent: "#F5D24E" # the wordmark yellow
  muted: "#CFCBBD" # subtitle grey, legible on ground
  wordmark: "PinoySing"
  tagline: "online karaoke"
  # Which look each brief angle gets. The template is a property of the angle,
  # so a new look is a line here rather than a code change.
  templates:
    default: marquee
    trivia_music: spotlight
    fun_nonmusic: spotlight
    karaoke_culture: spotlight
    app_feature: stage
    trending_music: stage
    song_spotlight: stage
    artist_spotlight: marquee
    okasyon: marquee
    duet_night: marquee
    music_jokes: spotlight
