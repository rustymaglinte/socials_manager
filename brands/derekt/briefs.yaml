# Brief angles — Derekt
#
# One angle is picked per run and joined with `shared`, so the rules that apply
# to every post are written once instead of repeated per angle. Selection and
# assembly live in app/agent/brief.py; nothing in code knows these angle names,
# so add, rename, and delete freely.
#
# Safe to leave half-written. Anything still containing TODO is dropped at load
# with a warning, exactly like voice.md — a TODO rendered into the model's first
# turn is worse than no angle at all. A brand with no usable angle simply cannot
# be auto-briefed yet; briefing it by hand still works.
#
# Placeholder filled per run: {today} — the date in this brand's timezone. Set
# `timezone:` in brand.yaml, or it resolves in UTC.

