slug: derekt
display_name: "Derekt" # trading SaaS
tier: brand
policy_profile: strict # compliance-adjacent; see domain/policy/profiles/strict.py
slack_channel: "#derekt-socials"
# The audience's clock, not the server's -- decides what "today" means in a
# brief. Left out, it resolves in UTC. Uncomment with an IANA name once the
# audience's timezone is decided; a name that is not in the tz database fails
# at load rather than mid-run. (Not "TODO": this one is validated.)
# timezone: "UTC"

# Ids are not written here: each comes from the environment (FB_PAGE_ID_DEREKT,
# X_HANDLE_DEREKT, YOUTUBE_CHANNEL_ID_DEREKT). Unset means unpublishable, and
# a page_id/handle/channel_id key here refuses to load. See .env.example.
accounts:
  - platform: facebook # Page, via Graph API
    enabled: true
  - platform: x
    enabled: true
  - platform: youtube
    enabled: true

cadence:
  max_per_day: 2
  max_per_week: 10

approval:
  required: always
  max_schedule_days_ahead: 30

# Hard blocks — enforced in code, not by the model.
banned_terms:
  - "guaranteed returns"
  - "risk-free"
  - "can't lose"
  - "get rich"
  - "sure thing"

required_disclaimers:
  promotional: "Not financial advice. Trading involves risk of loss."

hashtags:
  default: ["#Derekt", "DeFi", "#trading", "tradingbot"]
