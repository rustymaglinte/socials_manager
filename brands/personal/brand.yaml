slug: personal
display_name: "Rusty Maglinte"
tier: personal # stricter defaults: never auto-publish
policy_profile: personal
slack_channel: "#personal-socials"
# The audience's clock, not the server's -- decides what "today" means in a
# brief. Left out, it resolves in UTC. Uncomment with an IANA name once the
# audience's timezone is decided; a name that is not in the tz database fails
# at load rather than mid-run. (Not "TODO": this one is validated.)
# timezone: "Asia/Manila"

# Ids are not written here: each comes from the environment (LINKEDIN_ID_PERSONAL).
# Unset means unpublishable, and a handle key here refuses to load. See .env.example.
accounts:
  - platform: linkedin
    enabled: true
  # NOTE: Facebook personal-profile posting is NOT possible via the Graph API
  # (publish_actions removed in v3.0, 2018). Create a Page or keep it manual.

cadence:
  max_per_day: 1
  max_per_week: 3

approval:
  required: always
  max_schedule_days_ahead: 7
